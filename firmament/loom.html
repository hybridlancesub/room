<!doctype html>
<!-- SPDX-License-Identifier: AGPL-3.0-or-later -->
<html lang="en" data-loom="boot">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark" />
<title>Loom — what the room is doing now</title>
<style>
  :root {
    --void: #0a0b10;
    --ink: #c8d0e4;
    --dim: #6b7488;
    --contribute: #7aa2d8;
    --affirm: #79b98a;
    --challenge: #d89a6a;
    --line: rgba(140, 152, 180, 0.10);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: var(--void); color: var(--ink); height: 100%;
    font: 300 14px/1.55 "Inter", "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr; grid-template-columns: 1fr 34ch; }

  header { grid-column: 1 / -1; display: flex; gap: 1.6rem; align-items: baseline;
    padding: 0.9rem 1.4rem; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { font-size: 0.8rem; font-weight: 400; letter-spacing: 0.3em; text-transform: uppercase; color: var(--ink); }
  #status { font-size: 0.72rem; color: var(--dim); letter-spacing: 0.06em; }
  #status b { color: var(--ink); font-weight: 400; }
  .windows { margin-left: auto; display: flex; gap: 0.4rem; }
  .windows button { background: none; border: 1px solid var(--line); color: var(--dim);
    font: inherit; font-size: 0.68rem; letter-spacing: 0.1em; padding: 0.15rem 0.7rem; cursor: pointer; border-radius: 2px; }
  .windows button.on { color: var(--ink); border-color: rgba(140,152,180,0.45); }

  main { overflow-y: auto; padding: 1rem 1.4rem 2rem; }

  /* the feed: the last things said, as text */
  #feed { margin-bottom: 1.8rem; }
  #feed h2, #lanes h2 { font-size: 0.66rem; font-weight: 400; letter-spacing: 0.24em;
    text-transform: uppercase; color: var(--dim); margin-bottom: 0.6rem; }
  .fentry { display: grid; grid-template-columns: 5.5rem 1fr; gap: 0.8rem; padding: 0.42rem 0.2rem;
    border-bottom: 1px solid var(--line); cursor: pointer; }
  .fentry:hover { background: rgba(140,152,180,0.05); }
  .fentry .who { font-size: 0.68rem; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fentry .what { font-size: 0.78rem; }
  .fentry .what .kind { font-weight: 500; margin-right: 0.4rem; }
  .kind.contribute { color: var(--contribute); } .kind.affirm { color: var(--affirm); } .kind.challenge { color: var(--challenge); }
  .fentry .what .dom { color: var(--dim); font-size: 0.66rem; letter-spacing: 0.05em; }
  .fentry .what .tgt { color: var(--dim); font-size: 0.66rem; }

  /* the lanes: one row per domain, time left to right */
  .lane { display: grid; grid-template-columns: 13rem 1fr; gap: 0.8rem; align-items: center; min-height: 1.5rem; }
  .lane .name { font-size: 0.68rem; color: var(--dim); white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; text-align: right; }
  .lane .name b { color: var(--ink); font-weight: 400; }
  .lane .row { position: relative; height: 1.1rem; border-bottom: 1px solid var(--line); }
  .tick { position: absolute; top: 50%; transform: translate(-50%, -50%); border-radius: 50%; cursor: pointer; }
  .tick.contribute { background: var(--contribute); } .tick.affirm { background: var(--affirm); } .tick.challenge { background: var(--challenge); }
  .tick.setaside { opacity: 0.35; }
  .tick:hover { outline: 1px solid var(--ink); }
  .axis { display: grid; grid-template-columns: 13rem 1fr; gap: 0.8rem; margin-top: 0.3rem; }
  .axis .marks { position: relative; height: 1rem; }
  .axis .marks span { position: absolute; transform: translateX(-50%); font-size: 0.6rem; color: var(--dim); }

  aside { border-left: 1px solid var(--line); overflow-y: auto; padding: 1rem 1.2rem; }
  aside h2 { font-size: 0.66rem; font-weight: 400; letter-spacing: 0.24em; text-transform: uppercase; color: var(--dim); margin-bottom: 0.5rem; }
  #reader-who { font-size: 0.8rem; color: var(--ink); }
  #reader-meta { font-size: 0.64rem; color: var(--dim); margin: 0.2rem 0 0.8rem; letter-spacing: 0.04em; }
  #reader-body { font-size: 0.82rem; white-space: pre-wrap; line-height: 1.7; }
  #reader .hint { color: var(--dim); font-size: 0.72rem; }

  #proposals { margin-top: 1.6rem; }
  .prop { font-size: 0.7rem; color: var(--dim); padding: 0.3rem 0; border-bottom: 1px solid var(--line); }
  .prop b { color: var(--ink); font-weight: 400; }
  .prop .adopted { color: var(--affirm); }
  #error { color: #d88; font-size: 0.8rem; padding: 1rem; display: none; }
</style>
</head>
<body>
<header>
  <h1>Loom</h1>
  <div id="status">connecting…</div>
  <div class="windows">
    <button data-min="60">1h</button>
    <button data-min="360">6h</button>
    <button data-min="1440" class="on">24h</button>
    <button data-min="0">all</button>
  </div>
</header>
<main>
  <div id="error"></div>
  <section id="feed"><h2>Latest — the room's own words</h2><div id="feed-list"></div></section>
  <section id="lanes"><h2>Domains over time</h2><div id="lane-list"></div><div class="axis"><div></div><div class="marks" id="marks"></div></div></section>
</main>
<aside>
  <h2>Reading</h2>
  <div id="reader"><span class="hint">select an entry — from the feed or a tick — and its full text, verbatim and attributed, appears here.</span></div>
  <div id="proposals"></div>
</aside>
<script type="module" src="./src/loom.js"></script>
</body>
</html>
